name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: prototype-feedback-server.exe
            asset_name: prototype-feedback-server-windows.exe
          - os: macos-latest
            artifact: prototype-feedback-server
            asset_name: prototype-feedback-server-macos
          - os: ubuntu-latest
            artifact: prototype-feedback-server
            asset_name: prototype-feedback-server-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller prototype-feedback-server.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/prototype-feedback-server-windows.exe/prototype-feedback-server.exe
            artifacts/prototype-feedback-server-macos/prototype-feedback-server
            artifacts/prototype-feedback-server-linux/prototype-feedback-server
